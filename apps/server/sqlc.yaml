# One query file per feature under internal/db/queries/ (owned by one ticket each).
# sqlc emits one <file>.sql.go per query file, so parallel tickets generate disjoint Go files.
# models.go and db.go derive only from the schema, which is fixed after ticket .1.
# emit_interface is OFF on purpose: querier.go would be a shared, conflict-prone file and nothing needs it
# (tests use a real SQLite file, never a mock Querier).
version: "2"
sql:
  - engine: sqlite
    schema: internal/db/migrations # sqlc understands goose files and skips "-- +goose Down"
    queries: internal/db/queries
    gen:
      go:
        package: db
        out: internal/db
        emit_json_tags: false
        emit_pointers_for_null_types: true
        emit_empty_slices: true
