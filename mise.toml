[tools]
bun = "1.4.4"
go = "1.27.3"
sqlc = "1.31.1"
"go:github.com/gzuidhof/tygo" = "0.2.21"

[env]
BASE_PATH = "/mmtc34"

# sqlc (Go compiles) and tygo (web typechecks) are independent; TanStack's routeTree.gen.ts is
# produced by the Vite plugin during `bun run dev|build`.
[tasks."gen:sqlc"]
dir = "apps/server"
run = "sqlc generate"

[tasks."gen:types"]
dir = "apps/server"
run = "tygo generate"

[tasks.gen]
depends = ["gen:sqlc", "gen:types"]

[tasks."dev:server"]
dir = "apps/server"
env = { DEV_LOGIN = "1", DATA_DIR = "./data", SESSION_SECRET = "dev-secret-dev-secret-dev-secret-00", PORT = "8080", SUPER_ADMIN_PASSWORD = "dev-super-admin-pw" }
run = "go run ."

[tasks.seed]
dir = "apps/server"
env = { DATA_DIR = "./data" }
run = "go run . seed"

[tasks."dev:web"]
depends = ["gen:types"]
dir = "apps/web"
run = "bun run dev" # Vite proxies $BASE_PATH/api -> :8080

[tasks.dev]
depends = ["dev:server", "dev:web"]

[tasks.test]
dir = "apps/server"
run = "go test ./..."

[tasks.check]
depends = ["gen"]
run = ["cd apps/server && go vet ./...", "bun run check-types", "bunx biome check"]

[tasks."web:build"]
depends = ["gen:types"]
run = "bun install --frozen-lockfile && cd apps/web && bun run build" # outDir: apps/server/internal/spa/dist

[tasks.build]
depends = ["web:build"]
dir = "apps/server"
env = { CGO_ENABLED = "0" }
run = "go build -trimpath -o ../../bin/mmtc34 ."

[tasks.docker]
run = "docker build -t mmtc34 ."
