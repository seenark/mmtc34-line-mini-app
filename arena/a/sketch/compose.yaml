services:
  app:
    image: mmtc34:latest
    build: { context: ., args: { BASE_PATH: /mmtc34 } }
    restart: unless-stopped
    ports: ["8080:8080"]
    env_file: .env # LINE_CHANNEL_ID, LIFF_ID, SESSION_SECRET, ADMIN_LINE_USER_IDS
    environment:
      BASE_PATH: /mmtc34
    volumes:
      - data:/data # app.db (+ -wal/-shm) and files/{images,slips}
volumes:
  data:
