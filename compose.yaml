services:
  app:
    image: mmtc34
    build:
      context: .
      args:
        BASE_PATH: ${BASE_PATH:-/mmtc34}
    restart: unless-stopped
    ports:
      # localhost only: the tunnel or gateway is the way in. HOST_PORT avoids clashing with other apps.
      - "127.0.0.1:${HOST_PORT:-8080}:8080"
    environment:
      BASE_PATH: ${BASE_PATH:-/mmtc34}
      LINE_CHANNEL_ID: ${LINE_CHANNEL_ID}
      LIFF_ID: ${LIFF_ID}
      SESSION_SECRET: ${SESSION_SECRET}
      SUPER_ADMIN_USERNAME: ${SUPER_ADMIN_USERNAME:-admin}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD}
    volumes:
      - data:/data # app.db (+ -wal/-shm) and files/{images,slips}

volumes:
  data:
