services:
  app:
    image: mmtc34
    build:
      context: .
      args:
        BASE_PATH: /mmtc34
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      LINE_CHANNEL_ID: ${LINE_CHANNEL_ID}
      LIFF_ID: ${LIFF_ID}
      SESSION_SECRET: ${SESSION_SECRET}
      ADMIN_LINE_USER_IDS: ${ADMIN_LINE_USER_IDS}
    volumes:
      - data:/data # app.db (+ -wal/-shm) and files/{images,slips}

volumes:
  data:
